[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dmi-framework"
version = "2.3.0"
description = "DMI Financial Intelligence Platform"
authors = [
    {name = "Đức Mạnh"}
]
requires-python = ">=3.10"

dependencies = [
    "pandas",
    "numpy",
    "openpyxl",
    "xlsxwriter",
    "requests",
    "python-telegram-bot"
]

[tool.setuptools.packages.find]
where = ["."]
include = ["dmi_core*", "apps*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]